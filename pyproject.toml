[project]
name = "documind"
version = "0.1.0"
description = "A fast Retrieval-Augmented Generation (RAG) backend API using Groq, ChromaDB, and FastAPI."
readme = "README.md"
authors = [
    { name = "Abhinay Srivastava", email = "abhinay3180@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "langchain>=1.3.16",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-huggingface>=1.2.2",
    "langchain-groq>=0.1.0",
    "langchain-text-splitters>=1.1.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pypdf>=3.0.0",
]

[project.scripts]
rag-project = "rag_project:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
